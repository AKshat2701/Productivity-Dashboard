<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Productivity Dashboard</title>
    <link rel="stylesheet" href="style.css">
    <link
    href="https://cdn.jsdelivr.net/npm/remixicon@4.9.0/fonts/remixicon.css"
    rel="stylesheet"/>
</head>
<body>

    <div id="main">
        

        <section class="allElems" >
            <div class="todo elem" id="0">
                <img src="https://images.unsplash.com/photo-1648457257285-cfbc3781cc54?w=1600&auto=format&fit=crop&q=60&ixlib=rb-4.1.0&ixid=NHwxMjA3fDA%3D" alt="">
                <h2>To Do List</h2>
            </div>
            <div class="daily elem" id="1">
                <img src="https://images.unsplash.com/photo-1678986718987-76f0b9357e0f?w=1600&auto=format&fit=crop&q=60&ixlib=rb-4.1.0&ixid=NHwxMjA3fDA%3D" alt="">
                <h2>Daily Planner</h2>
            </div>
            <div class="moti elem" id="2">
                <img src="https://images.unsplash.com/photo-1718202248333-1dab8271f400?q=80&w=1528&auto=format&fit=crop&ixlib=rb-4.1.0&ixid=NHwxMjA3fDA%3D" alt="">
                <h2>Motivation</h2>
            </div>
            <div class="pomo elem" id="3">
                <img src="https://images.unsplash.com/photo-1697498435309-2c7864cfd607?w=1600&auto=format&fit=crop&q=60&ixlib=rb-4.1.0&ixid=NHwxMjA3fDA%3D" alt="">
                <h2>Pomodoro Timer</h2>
            </div>
            <div class="goals elem" id="4">
                <img src="https://plus.unsplash.com/premium_photo-1670953512914-f471e50e804a?w=700&auto=format&fit=crop&q=60&ixlib=rb-4.1.0&ixid=NHwxMjA3fDA%3D" alt="">
                <h2>Daily Goals</h2>
            </div>
        </section>

        <section class="fullElem">
            <button class="back"><i class="ri-close-fill"></i></button>
            <h1>Todo Page</h1>
        </section>
        <section class="fullElem">
            <button class="back"><i class="ri-close-fill"></i></button>
            <h1>Daily Planner</h1>
        </section>
        <section class="fullElem">
            <button class="back"><i class="ri-close-fill"></i></button>
            <h1>Motivational Quote</h1>
        </section>
        <section class="fullElem" >
            <button class="back"><i class="ri-close-fill"></i></button>
            <h1>Pomodoro Timer</h1>
        </section>
        <section class="fullElem">
            <button class="back"><i class="ri-close-fill"></i></button>
            <h1>Daily Goals</h1>
        </section>
    </div>


    <script src="script.js"></script>
    
</body>
</html>
