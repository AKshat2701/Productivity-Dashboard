<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Productivity Dashboard</title>
    <link rel="stylesheet" href="style.css">
    <link
    href="https://cdn.jsdelivr.net/npm/remixicon@4.9.0/fonts/remixicon.css"
    rel="stylesheet"/>
</head>
<body>

    <div id="main">
        

        <section class="allElems" >
            <div class="todo elem" id="0">
                <img src="https://images.unsplash.com/photo-1648457257285-cfbc3781cc54?w=1600&auto=format&fit=crop&q=60&ixlib=rb-4.1.0&ixid=NHwxMjA3fDA%3D" alt="">
                <h2>To Do List</h2>
            </div>
            <div class="daily elem" id="1">
                <img src="https://images.unsplash.com/photo-1678986718987-76f0b9357e0f?w=1600&auto=format&fit=crop&q=60&ixlib=rb-4.1.0&ixid=NHwxMjA3fDA%3D" alt="">
                <h2>Daily Planner</h2>
            </div>
            <div class="moti elem" id="2">
                <img src="https://images.unsplash.com/photo-1718202248333-1dab8271f400?q=80&w=1528&auto=format&fit=crop&ixlib=rb-4.1.0&ixid=NHwxMjA3fDA%3D" alt="">
                <h2>Motivational Quotes</h2>
            </div>
            <div class="pomo elem" id="3">
                <img src="https://images.unsplash.com/photo-1697498435309-2c7864cfd607?w=1600&auto=format&fit=crop&q=60&ixlib=rb-4.1.0&ixid=NHwxMjA3fDA%3D" alt="">
                <h2>Pomodoro Timer</h2>
            </div>
            <div class="goals elem" id="4">
                <img src="https://plus.unsplash.com/premium_photo-1670953512914-f471e50e804a?w=700&auto=format&fit=crop&q=60&ixlib=rb-4.1.0&ixid=NHwxMjA3fDA%3D" alt="">
                <h2>Daily Goals</h2>
            </div>
        </section>


        <section class="fullElem todo-list-fullpage">
            <button class="back" id="0"><i class="ri-close-fill"></i></button>
            <h2>Your personalised Task List</h2>

            <div class="todo-container">
                <div class="addTask">
                    <form action="#">

                        <input id="task-input" type="text" placeholder="Enter Task">
                        <textarea placeholder="Enter Details" name="" id="" rows="10"></textarea>

                        <div class="mark-imp">
                            <input type="checkbox" id="check">
                            <label for="check">Mark as Important!</label>
                        </div>

                        <button>Add Task</button>
                    </form>
                </div>
                <div class="allTask">
                    
                </div>
            </div>
        </section>


        <section class="fullElem daily-planner-fullpage">
            <button class="back" id="1"><i class="ri-close-fill"></i></button>
            <h2>Plan Your Day to be More Productive</h2>

            <div class="day-planner">
                <div class="day-planner-time">
                    <p>6:00 - 7:00</p>
                    <input type="text" placeholder="...">
                </div>
            </div>
        </section>


        <section class="fullElem motivational-fullpage">
            <button class="back" id="2"><i class="ri-close-fill"></i></button>

            <div class="motivation-container">
                <div class="motivation-wrapper">
                    <div class="motivation-1">
                        <h2>Quote of the Day</h2>
                    </div>
                    <div class="motivation-2">
                        <h2>Lorem ipsum dolor sit amet, consectetur adipisicing elit. Harum, excepturi.</h2>
                        <div class="motivation-3">
                            <h3>Akshat Srivastava</h3>
                        </div>
                    </div>
                </div>
            </div>
        </section>


        <section class="fullElem pomodoro-fullpage" >
            <button class="back" id="3"><i class="ri-close-fill"></i></button>
            <h1>Pomodoro Timer</h1>
        </section>


        <section class="fullElem daily-goals-fullpage">
            <button class="back" id="4"><i class="ri-close-fill"></i></button>
            <h1>Daily Goals</h1>
        </section>
    </div>


    <script src="script.js"></script>
    
</body>
</html>
